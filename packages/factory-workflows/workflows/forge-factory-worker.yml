name: Forge Factory Worker
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      FORGE_JEV_TOKEN:
        required: false

permissions: {}

jobs:
  assemble:
    name: Restore the approved APM capability lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      lock: ${{ steps.install.outputs.lock }}
      modules: ${{ steps.install.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: install
        run: |
          set -euo pipefail
          node factory/cli.mjs assemble | jq -e '.pending == []' > /dev/null
          node factory/cli.mjs assemble --apm | diff -u apm.yml -
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/microsoft/apm/releases/assets/606234092?download=1' -o "$scratch/apm.tar.gz"
          printf '%s  %s\n' 'e6374402c74318f7c8bef97a90d8572d049fdab0dc3871492c6b0647ae9e881f' "$scratch/apm.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apm.tar.gz" -C "$scratch"
          apm="$(find "$scratch" -type f -name apm -print -quit)"
          mkdir "$scratch/project"
          cp apm.yml apm.lock.yaml "$scratch/project/"
          lock="$(sha256sum apm.lock.yaml | cut -d ' ' -f1)"
          (
            cd "$scratch/project"
            "$apm" install --target copilot --frozen
            "$apm" audit --ci
          )
          cmp apm.lock.yaml "$scratch/project/apm.lock.yaml"
          printf 'lock=%s\n' "$lock" >> "$GITHUB_OUTPUT"
          archive="$RUNNER_TEMP/apm_modules.tar"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "$archive" -C "$scratch/project" apm_modules
          printf 'modules=%s\n' "$(sha256sum "$archive" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-apm-modules
          path: ${{ runner.temp }}/apm_modules.tar
          if-no-files-found: error

  build:
    name: Build and repair the selected story
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      package: ${{ steps.resolve.outputs.package }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-apm-modules
          path: ${{ runner.temp }}/apm-restore
      - name: Restore the audited capability bytes
        env:
          APM_MODULES: ${{ needs.assemble.outputs.modules }}
        run: |
          set -euo pipefail
          [[ "$APM_MODULES" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/apm-restore/apm_modules.tar"
          printf '%s  %s\n' "$APM_MODULES" "$archive" | sha256sum --check
          tar --no-same-owner -xf "$archive"
      - id: resolve
        env:
          STORY: ${{ github.event.inputs.story || 'STORY-001' }}
          INPUT_DIRECTORY: ${{ github.event.inputs.input_directory }}
          TOPOLOGY: ${{ github.event.inputs.topology || 'delegated' }}
          PUBLISH_PAGES: ${{ github.event.inputs.publish_pages }}
          PUBLIC_INPUTS: ${{ github.event.inputs.public_inputs }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: |
          set -euo pipefail
          [[ "$STORY" =~ ^STORY-[0-9]+$ ]]
          [[ "$TOPOLOGY" == direct || "$TOPOLOGY" == delegated ]]
          if [[ -n "$INPUT_DIRECTORY" ]]; then
            [[ "$INPUT_DIRECTORY" =~ ^[a-zA-Z0-9_/-]+$ && "$INPUT_DIRECTORY" != /* ]]
            [[ "$PUBLIC_INPUTS" == true ]] || { echo '::error::Confirm that the tracked inputs are public and safe to send to Copilot and retain in run artifacts.'; exit 1; }
            [[ "$PUBLISH_PAGES" != true ]] || { echo '::error::Pages accepts only the public reference fixture.'; exit 1; }
          fi
          case "$WEBSITE_RELEASE" in
            '') role=skills; package_name=requirements ;;
            baseline|step-free|current)
              [[ -z "$INPUT_DIRECTORY" ]] || { echo '::error::Website releases use their reviewed product document.'; exit 1; }
              role=websiteChecking; package_name=website-acceptance ;;
            *) echo '::error::Unknown website release.'; exit 1 ;;
          esac
          package="$(node factory/cli.mjs assemble | jq -er --arg role "$role" '.packages[$role]')"
          [[ "$package" =~ ^richgo/forge-kit-skills/packages/"$package_name"#[0-9a-f]{40}$ ]]
          printf 'package=%s\nstory=%s\ninput_directory=%s\ntopology=%s\n' \
            "$package" "$STORY" "$INPUT_DIRECTORY" "$TOPOLOGY" >> "$GITHUB_OUTPUT"
      - name: Run the factory with approved product and architecture inputs
        if: github.event.inputs.website_release == ''
        env:
          FORGE_JEV_TOKEN: ${{ github.event.inputs.use_jev == 'true' && secrets.FORGE_JEV_TOKEN || '' }}
          USE_JEV: ${{ github.event.inputs.use_jev }}
          INJECT_FAULT: ${{ github.event.inputs.inject_fault }}
          STORY: ${{ steps.resolve.outputs.story }}
          INPUT_DIRECTORY: ${{ steps.resolve.outputs.input_directory }}
          TOPOLOGY: ${{ steps.resolve.outputs.topology }}
        run: |
          set -euo pipefail
          [[ "$USE_JEV" != true || -n "$FORGE_JEV_TOKEN" ]] || { echo '::error::Configure FORGE_JEV_TOKEN.'; exit 1; }
          inputs="$RUNNER_TEMP/story-inputs"
          mkdir "$inputs"
          if [[ -n "$INPUT_DIRECTORY" ]]; then
            for file in product-requirements.md acceptance.json architecture.json architecture.c4; do
              git show "HEAD:$INPUT_DIRECTORY/$file" > "$inputs/$file"
            done
          else
            cp examples/{product-requirements.md,acceptance.json} "$inputs/"
            if [[ "$TOPOLOGY" == delegated ]]; then
              cp test/fixtures/delegated/{architecture.json,architecture.c4} "$inputs/"
            else
              cp architecture/slice.json "$inputs/architecture.json"
              cp architecture/slice.c4 "$inputs/architecture.c4"
            fi
          fi
          fault=()
          if [[ "$INJECT_FAULT" == true ]]; then fault=(--fault wrong-output-once); fi
          node factory/cli.mjs run out --inputs "$inputs" --story "$STORY" "${fault[@]}"
          cp "$inputs"/{product-requirements.md,acceptance.json} out/
      - name: Plan the approved Trail Desk change
        if: github.event.inputs.website_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN: ${{ github.event.inputs.rollback_run_id }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: bash factory/plan-release.sh "$WEBSITE_RELEASE" > "$RUNNER_TEMP/impact-plan.json"
      - name: Generate the CALM model, LikeC4 view, and website from the approved release
        if: github.event.inputs.website_release != ''
        env:
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: |
          set -euo pipefail
          node factory/website.mjs build "examples/trail-desk/$WEBSITE_RELEASE/product-requirements.md" out
          cp "$RUNNER_TEMP/impact-plan.json" out/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-candidate
          path: out/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-failure-state
          path: |
            out/state.json
            out/repair-decisions.json
            out/rejected*.mjs
          if-no-files-found: ignore

  contract:
    name: Run the APMX product story contract
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-candidate
          path: out
      - name: Install the verified APMX 0.8.0 release
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/danielmeppiel/apmx/releases/assets/699962963?download=1' -o "$scratch/apmx.tar.gz"
          printf '%s  %s\n' '524027362fe88728836ec6476d2c828d26b750d2067809c5741f27d950b93778' "$scratch/apmx.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apmx.tar.gz" -C "$scratch"
          apmx="$(find "$scratch" -type f -name apmx -print -quit)"
          test -x "$apmx"
          dirname "$apmx" >> "$GITHUB_PATH"
      - run: npm install --global --no-fund --no-audit @github/copilot@1.0.107
      - name: Produce contract output for the actual candidate
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/factory-story"
          mkdir "$workspace"
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            cp out/{product-requirements.md,acceptance.json,catalog.json,architecture.json,architecture.c4,index.html,candidate-evidence.json} "$workspace/"
          else
            cp out/{product-requirements.md,acceptance.json,plan.json,receipt.json,deployed.mjs} "$workspace/"
          fi
          cd "$workspace"
          apmx --from "$PACKAGE" --on copilot --allow-host-access --allow-unproven-inputs
          receipts=(.apm/*/*/receipt.intoto.jsonl)
          test "${#receipts[@]}" -eq 1
          test -f "${receipts[0]}"
          mkdir "$RUNNER_TEMP/producer-receipt"
          cp -r "${receipts[0]}" "$(dirname "${receipts[0]}")/evidence" "$RUNNER_TEMP/producer-receipt/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-contract-producer
          path: ${{ runner.temp }}/producer-receipt
          if-no-files-found: error

  verify:
    name: Replay the story and independently check the contract
    needs: [assemble, build, contract]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-apm-modules
          path: ${{ runner.temp }}/apm-restore
      - name: Restore the audited capability bytes
        env:
          APM_MODULES: ${{ needs.assemble.outputs.modules }}
        run: |
          set -euo pipefail
          [[ "$APM_MODULES" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/apm-restore/apm_modules.tar"
          printf '%s  %s\n' "$APM_MODULES" "$archive" | sha256sum --check
          tar --no-same-owner -xf "$archive"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-candidate
          path: out
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-contract-producer
          path: ${{ runner.temp }}/producer-receipt
      - name: Install the verified APMX 0.8.0 release
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/danielmeppiel/apmx/releases/assets/699962963?download=1' -o "$scratch/apmx.tar.gz"
          printf '%s  %s\n' '524027362fe88728836ec6476d2c828d26b750d2067809c5741f27d950b93778' "$scratch/apmx.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apmx.tar.gz" -C "$scratch"
          apmx="$(find "$scratch" -type f -name apmx -print -quit)"
          test -x "$apmx"
          dirname "$apmx" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.3'
      - name: Verify the readiness probe against the approved inputs
        if: github.event.inputs.website_release == ''
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          STORY: ${{ github.event.inputs.story || 'STORY-001' }}
          INPUT_DIRECTORY: ${{ github.event.inputs.input_directory }}
          TOPOLOGY: ${{ github.event.inputs.topology || 'delegated' }}
          USE_JEV: ${{ github.event.inputs.use_jev }}
          INJECT_FAULT: ${{ github.event.inputs.inject_fault }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/story-inputs"
          mkdir "$inputs"
          [[ "$PACKAGE" == "$(node factory/cli.mjs assemble | jq -er '.packages.skills')" ]]
          repairs=0
          if [[ "$INJECT_FAULT" == true ]]; then repairs=1; fi
          jq -e --argjson repairs "$repairs" '.predicate.repairs == $repairs' out/receipt.json > /dev/null
          if [[ -n "$INPUT_DIRECTORY" ]]; then
            for file in product-requirements.md acceptance.json architecture.json architecture.c4; do
              git show "HEAD:$INPUT_DIRECTORY/$file" > "$inputs/$file"
            done
          else
            cp examples/{product-requirements.md,acceptance.json} "$inputs/"
            if [[ "$TOPOLOGY" == delegated ]]; then
              cp test/fixtures/delegated/{architecture.json,architecture.c4} "$inputs/"
            else
              cp architecture/slice.json "$inputs/architecture.json"
              cp architecture/slice.c4 "$inputs/architecture.c4"
            fi
          fi
          bash factory/validate-calm.sh "$inputs/architecture.json"
          npx --yes --package likec4@1.60.0 likec4 validate "$inputs"
          advisor=fixture-policy
          if [[ "$USE_JEV" == true ]]; then advisor=typed-advisor; fi
          node factory/cli.mjs requirements-evidence out --inputs "$inputs" --story "$STORY" --repair-advisor "$advisor" > out/requirements-verification.json
          cp "$inputs"/{product-requirements.md,acceptance.json} out/
      - name: Validate CALM and LikeC4 and replay the approved website stories in Chromium
        if: github.event.inputs.website_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN: ${{ github.event.inputs.rollback_run_id }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" == "$(node factory/cli.mjs assemble | jq -er '.packages.websiteChecking')" ]]
          bash factory/plan-release.sh "$WEBSITE_RELEASE" > "$RUNNER_TEMP/independent-plan.json"
          unset GH_TOKEN
          cmp "$RUNNER_TEMP/independent-plan.json" out/impact-plan.json
          npx --yes --package @finos/calm-cli@1.68.0 calm validate --strict -a out/architecture.json
          npx --yes --package likec4@1.60.0 likec4 validate out
          npm install --prefix "$RUNNER_TEMP/browser" --no-fund --no-audit playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install chromium
          export FORGE_PLAYWRIGHT="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          node factory/website.mjs verify "examples/trail-desk/$WEBSITE_RELEASE/product-requirements.md" out > out/browser-evidence.json
      - name: Independently replay the APMX contract on the checked build
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/factory-story"
          mkdir "$workspace" verified
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            cp out/{product-requirements.md,acceptance.json,catalog.json,architecture.json,architecture.c4,index.html,candidate-evidence.json} "$workspace/"
          else
            cp out/{product-requirements.md,acceptance.json,plan.json,receipt.json,deployed.mjs} "$workspace/"
          fi
          (
            cd "$workspace"
            apmx check "$RUNNER_TEMP/producer-receipt" --from "$PACKAGE"
          )
          receipts=("$workspace"/.apm/*/*/receipt.intoto.jsonl)
          test "${#receipts[@]}" -eq 1
          test -f "${receipts[0]}"
          cmp <(jq -S . out/requirements-verification.json) <(jq -S . "$(dirname "${receipts[0]}")/outputs/requirements-verification.json")
          cp -r "${receipts[0]}" "$(dirname "${receipts[0]}")/evidence" verified/
          cp out/requirements-verification.json verified/
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            cp out/{architecture.json,architecture.c4,browser-evidence.json,security-verification.json,impact-plan.json} verified/
          else
            cp out/receipt.json verified/
            if [[ -f out/repair-decisions.json ]]; then cp out/repair-decisions.json verified/; fi
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-verified
          path: verified/
          if-no-files-found: error
      - if: github.event.inputs.publish_pages == 'true' && github.event.inputs.website_release == ''
        run: node factory/pages.mjs package out release "$GITHUB_SHA"
      - if: github.event.inputs.website_release != ''
        run: node factory/website.mjs package out release "$GITHUB_SHA"
      - name: Archive the independently verified release
        if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        run: |
          mkdir pages-archive
          tar -cf pages-archive/artifact.tar -C release .
      - if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-pages
          path: pages-archive/artifact.tar
          retention-days: 90
          if-no-files-found: error

  attest:
    name: Sign the checked APMX evidence and exact release archive
    needs: [assemble, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-verified
          path: verified
      - name: Install the verified APMX 0.8.0 release
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/danielmeppiel/apmx/releases/assets/699962963?download=1' -o "$scratch/apmx.tar.gz"
          printf '%s  %s\n' '524027362fe88728836ec6476d2c828d26b750d2067809c5741f27d950b93778' "$scratch/apmx.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apmx.tar.gz" -C "$scratch"
          apmx="$(find "$scratch" -type f -name apmx -print -quit)"
          test -x "$apmx"
          dirname "$apmx" >> "$GITHUB_PATH"
      - uses: danielmeppiel/apmx/.github/actions/attest@fae2067a0dc6ff07beda714015ff9e648f41ce63
        with:
          receipt: verified/receipt.intoto.jsonl

      - if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-pages
          path: archive
      - name: Bind release inputs and independent results
        if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        env:
          APM_MODULES: ${{ needs.assemble.outputs.modules }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
          APM_LOCK: ${{ needs.assemble.outputs.lock }}
        run: |
          set -euo pipefail
          [[ "$APM_LOCK" =~ ^[0-9a-f]{64}$ ]]
          hash() { sha256sum "$1" | cut -d ' ' -f1; }
          optional_hash() { if [[ -f "$1" ]]; then hash "$1"; fi; }
          browser="$(optional_hash verified/browser-evidence.json)"
          security="$(optional_hash verified/security-verification.json)"
          plan="$(optional_hash verified/impact-plan.json)"
          repairs="$(optional_hash verified/repair-decisions.json)"
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            [[ "$browser" =~ ^[0-9a-f]{64}$ && "$security" =~ ^[0-9a-f]{64}$ && "$plan" =~ ^[0-9a-f]{64}$ ]]
          fi
          jq -n --arg source "$GITHUB_SHA" --arg lock "$APM_LOCK" \
            --arg receipt "$(hash verified/receipt.intoto.jsonl)" \
            --arg checks "$(hash verified/requirements-verification.json)" --arg modules "$APM_MODULES" \
            --arg browser "$browser" --arg security "$security" --arg repairs "$repairs" --arg plan "$plan" \
            '{source: $source, apmLock: $lock, apmModules: $modules, apmxReceipt: $receipt, requirementsVerification: $checks, browserEvidence: $browser, securityVerification: $security, repairDecisions: $repairs, impactPlan: $plan}' > release-predicate.json
      - if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        id: pages-signature
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: archive/artifact.tar
          predicate-type: https://github.com/richgo/forge-kit/attestations/pages-release/v1
          predicate-path: release-predicate.json

      - if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-pages-signature
          path: ${{ steps.pages-signature.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

  authenticate:
    name: Verify the signed release archive
    if: github.event.inputs.website_release != '' || github.event.inputs.publish_pages == 'true'
    needs: [assemble, attest]
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-pages-signature
          path: signature
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-verified
          path: verified
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-pages
          path: archive
      - name: Authenticate the release bytes before granting deployment
        env:
          APM_MODULES: ${{ needs.assemble.outputs.modules }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
          PUBLISH_PAGES: ${{ github.event.inputs.publish_pages }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir proof
          signer="$(node factory/cli.mjs assemble | jq -er '.packages.orchestration | split("#")[1]')"
          bundles=(signature/*.json)
          test "${#bundles[@]}" -eq 1 && test -f "${bundles[0]}"
          verify=(
            --repo "$GITHUB_REPOSITORY" --bundle "${bundles[0]}"
            --signer-workflow richgo/forge-kit-skills/.github/workflows/forge-factory-worker.yml
            --signer-digest "$signer" --source-ref "$GITHUB_REF"
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            --predicate-type https://github.com/richgo/forge-kit/attestations/pages-release/v1
            --format json
          )
          gh attestation verify archive/artifact.tar "${verify[@]}" > proof/verified-signature.json
          hash() { sha256sum "$1" | cut -d ' ' -f1; }
          optional_hash() { if [[ -f "$1" ]]; then hash "$1"; fi; }
          browser="$(optional_hash verified/browser-evidence.json)"
          security="$(optional_hash verified/security-verification.json)"
          plan="$(optional_hash verified/impact-plan.json)"
          repairs="$(optional_hash verified/repair-decisions.json)"
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            [[ "$browser" =~ ^[0-9a-f]{64}$ && "$security" =~ ^[0-9a-f]{64}$ && "$plan" =~ ^[0-9a-f]{64}$ ]]
          fi
          jq -e --arg source "$GITHUB_SHA" --arg lock "$(hash apm.lock.yaml)" \
            --arg receipt "$(hash verified/receipt.intoto.jsonl)" \
            --arg checks "$(hash verified/requirements-verification.json)" --arg modules "$APM_MODULES" \
            --arg browser "$browser" --arg security "$security" --arg repairs "$repairs" --arg plan "$plan" \
            'any(.[].verificationResult.statement.predicate;
              . == {source: $source, apmLock: $lock, apmModules: $modules, apmxReceipt: $receipt, requirementsVerification: $checks, browserEvidence: $browser, securityVerification: $security, repairDecisions: $repairs, impactPlan: $plan})' \
            proof/verified-signature.json > /dev/null
          tar -xOf archive/artifact.tar ./release.json > proof/release.json
          jq -e --arg source "$GITHUB_SHA" '.source == $source' proof/release.json
          if [[ "$PUBLISH_PAGES" != true ]]; then
            cp archive/artifact.tar changed.tar
            printf 'unapproved bytes' >> changed.tar
            if gh attestation verify changed.tar "${verify[@]}" > /dev/null 2> proof/changed-archive-rejection.log; then
              echo '::error::Signature verification accepted a changed archive.'
              exit 1
            fi
            if gh attestation verify archive/artifact.tar "${verify[@]}" --signer-digest "$GITHUB_SHA" > /dev/null 2> proof/wrong-signer-rejection.log; then
              echo '::error::Signature verification accepted the wrong signer revision.'
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-release-proof
          path: proof/
          if-no-files-found: error

  pages:
    name: Publish and observe the verified reference
    if: github.event.inputs.publish_pages == 'true'
    needs: authenticate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 25
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-release-proof
          path: proof
      - name: Prepare the last known-good Trail Desk release
        id: previous
        if: github.event.inputs.website_release == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ github.event.inputs.rollback_run_id }}
          NO_ROLLBACK_OVERRIDE: ${{ github.event.inputs.allow_publish_without_rollback }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIOR_RUN" ]]; then
            [[ "$NO_ROLLBACK_OVERRIDE" == true ]] || { echo '::error::Supply the last known-good release run ID.'; exit 1; }
            echo '::warning::Operator approved a release without an authenticated rollback archive.'
            exit 0
          fi
          [[ "$NO_ROLLBACK_OVERRIDE" != true && "$PRIOR_RUN" =~ ^[1-9][0-9]*$ && "$PRIOR_RUN" != "$GITHUB_RUN_ID" ]]
          prior_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" | jq -er '
            select(.path == ".github/workflows/factory-e2e.yml" and .head_branch == "main" and
              .event == "workflow_dispatch" and .conclusion == "success") | .head_sha')"
          [[ "$prior_sha" =~ ^[0-9a-f]{40}$ ]]
          prior_signer="$(gh api "repos/$GITHUB_REPOSITORY/contents/factory/packages.json?ref=$prior_sha" --jq .content |
            base64 --decode | jq -er '.capabilities.orchestration |
              select(.repository == "richgo/forge-kit-skills" and .workflow == ".github/workflows/forge-factory.lock.yml") | .ref')"
          [[ "$prior_signer" =~ ^[0-9a-f]{40}$ ]]
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name factory-pages --dir previous/archive
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name factory-pages-signature --dir previous/signature
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name factory-pages-observation --dir previous/observation
          bundles=(previous/signature/*.json)
          test "${#bundles[@]}" -eq 1 && test -f "${bundles[0]}"
          gh attestation verify previous/archive/artifact.tar --repo "$GITHUB_REPOSITORY" \
            --bundle "${bundles[0]}" \
            --signer-workflow richgo/forge-kit-skills/.github/workflows/forge-factory-worker.yml \
            --signer-digest "$prior_signer" --source-ref refs/heads/main --source-digest "$prior_sha" \
            --deny-self-hosted-runners --predicate-type https://github.com/richgo/forge-kit/attestations/pages-release/v1 \
            --format json > proof/previous-verified-signature.json
          tar -xOf previous/archive/artifact.tar ./release.json > previous/release.json
          jq -e --arg source "$prior_sha" '.source == $source' previous/release.json
          page_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          jq -e --arg url "$page_url" --slurpfile prior previous/release.json '
            .observed == "passed" and .url == $url and del(.url, .observed) == $prior[0]' previous/observation/observed.json
          node factory/website.mjs probe "$page_url" previous/release.json > proof/previous-observation.json
          printf 'prepared=true\nrun=%s\n' "$PRIOR_RUN" >> "$GITHUB_OUTPUT"
      - if: steps.previous.outputs.prepared == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-pages-rollback
          path: previous/archive/artifact.tar
          if-no-files-found: error
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: factory-pages
          timeout: 240000
      - name: Observe the deployed release
        id: observe
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
          WEBSITE_RELEASE: ${{ github.event.inputs.website_release }}
        run: |
          if [[ -n "$WEBSITE_RELEASE" ]]; then
            node factory/website.mjs probe "$PAGE_URL" proof/release.json > proof/observed.json
          else
            node factory/pages.mjs probe "$PAGE_URL" proof/release.json > proof/observed.json
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-pages-observation
          path: proof/observed.json
          if-no-files-found: error
      - name: Restore the last known-good Pages archive
        id: restore
        if: ${{ failure() && steps.previous.outputs.prepared == 'true' && (steps.publish.outcome == 'failure' || steps.observe.outcome == 'failure') }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: factory-pages-rollback
          timeout: 240000
      - name: Independently observe the restored release
        id: observe-rollback
        if: ${{ failure() && steps.restore.outcome == 'success' }}
        env:
          PAGE_URL: ${{ steps.restore.outputs.page_url }}
        run: node factory/website.mjs probe "$PAGE_URL" previous/release.json > proof/rollback-observation.json
      - name: Record the deployment failure and recovery outcome
        if: ${{ failure() }}
        env:
          PUBLISH: ${{ steps.publish.outcome }}
          OBSERVE: ${{ steps.observe.outcome }}
          PRIOR_RUN: ${{ steps.previous.outputs.run }}
          RESTORE: ${{ steps.restore.outcome }}
          RESTORED_PROBE: ${{ steps.observe-rollback.outcome }}
        run: |
          mkdir -p proof
          jq -n --arg publish "$PUBLISH" --arg observe "$OBSERVE" --arg priorRun "$PRIOR_RUN" \
            --arg restore "$RESTORE" --arg restoredProbe "$RESTORED_PROBE" \
            '{publish: $publish, observe: $observe, priorRun: $priorRun, restore: $restore, restoredProbe: $restoredProbe}' > proof/recovery.json
          if [[ "$RESTORED_PROBE" == success ]]; then
            echo '::error::Candidate release failed. The previous release was restored and observed.'
          else
            echo '::error::Candidate release failed. An operator must verify the active release.'
          fi
      - if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: factory-pages-recovery
          path: proof/
          if-no-files-found: error
